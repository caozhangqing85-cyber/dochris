[project]
name = "dochris"
version = "1.5.0"
description = "个人知识库编译系统 - 四阶段流水线"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "caozhangqing85-cyber"}
]
keywords = ["knowledge-base", "llm", "rag", "obsidian", "compiler", "vector-search", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business",
    "Typing :: Typed",
    "Natural Language :: Chinese (Simplified)",
    "Environment :: Console",
]

dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "json-repair>=0.30.0",
]

[project.optional-dependencies]
documents = [
    "markitdown>=0.0.1",
]
vector = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]
api = [
    "fastapi>=0.100.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.20.0",
    "prometheus-client>=0.20.0",
    "sse-starlette>=2.1.0",
]
leann = [
    "leann>=0.3.7",
]
ollama = [
    "aiohttp>=3.9.0",
]
otel = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-api>=1.20.0",
]
audio = ["faster-whisper>=0.10.0"]
pdf = [
    "pypdf>=4.0.0",
    "pdfplumber>=0.10.0",
    "PyMuPDF>=1.20.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-asyncio>=0.21.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
    "httpx>=0.24.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
    "markdown-exec>=1.8.0",
]
standard = [
    "dochris[api,documents,pdf,vector]",
]
all = [
    "dochris[api,audio,documents,leann,ocr,ollama,pdf,vector]",
]

[project.scripts]
kb = "dochris.cli.main:main"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
dochris = []

[project.urls]
Homepage = "https://github.com/caozhangqing85-cyber/dochris"
Repository = "https://github.com/caozhangqing85-cyber/dochris"
Issues = "https://github.com/caozhangqing85-cyber/dochris/issues"
Changelog = "https://github.com/caozhangqing85-cyber/dochris/blob/main/CHANGELOG.md"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "ARG001", # unused-function-argument (interface signatures)
    "ARG002", # unused-method-argument (interface signatures)
    "SIM115", # open-file-with-context-handler
    "B017",   # assert-raises-exception
    "SIM105", # suppressible-exception
    "SIM113", # use-enumerate
    "ARG005", # unused-lambda-argument
    "SIM117", # multiple-with-statements (readability preference)
]

# Per-file ignores for legacy code patterns (E402: sys.path.insert or lazy imports)
per-file-ignores."src/dochris/compensate/compensate_utils.py" = ["E402"]
per-file-ignores."src/dochris/compensate/compensate_failures.py" = ["E402"]
per-file-ignores."src/dochris/compensate/compensate_extractors.py" = ["E402"]
per-file-ignores."src/dochris/admin/ocr_failed_pdf.py" = ["E402"]
per-file-ignores."src/dochris/admin/recompile.py" = ["E402"]
per-file-ignores."src/dochris/admin/sanitize_sensitive_words.py" = ["E402"]
per-file-ignores."src/dochris/admin/transcribe_failed_audio.py" = ["E402"]
per-file-ignores."src/dochris/phases/phase3_query.py" = ["E402"]
per-file-ignores."src/dochris/workers/compiler_worker.py" = ["E402"]
per-file-ignores."src/dochris/workers/monitor_worker.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
# 3.12：numpy 2.5+ 等 stub 使用 PEP 695 语法，3.11 目标无法解析其 stub。
# 3.11 运行时兼容由 CI 的 3.11 测试矩阵兜底。
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# numpy 2.5+ 的 stub 使用 PEP 695 `type` 语句，与 python_version=3.11 的检查不兼容；
# 项目代码不直接依赖 numpy 的类型信息，跳过其 stub 分析
[[tool.mypy.overrides]]
module = "numpy"
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "aiohttp",
    "faiss",
    "faster_whisper",
    "fitz",
    "importlib_metadata",
    "leann",
    "numpy",
    "pdfplumber",
    "prometheus_client",
    "pypdf",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=dochris",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=60",
]
markers = [
    "fast: Gate 1A fast PR suite for targeted unit and API contract checks",
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]
filterwarnings = [
    # DEBT-02：FAISS 的 SWIG 绑定在 Python 3.13 上的弃用告警（上游问题，待 faiss 更新）
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.coverage.run]
source = ["dochris"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
