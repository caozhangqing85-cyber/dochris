name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # REL-02: 与生产运行一致的 extras（api/vector/pdf/standard），
      # 避免 mypy 在缺少可选依赖存根时漏报或误报
      - run: pip install -e ".[dev,standard]" mypy
      - run: mypy src/dochris/

  test-fast:
    name: Fast Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,standard]"
      - name: Run Gate 1A fast suite
        run: make test-fast

  # REL-01: PR 必须跑关键集成套件（write-path / API / migration / 真实传输层契约），
  # 不能只依赖 fast tests 就合并
  test-integration:
    name: Integration Suite (PR gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,standard]"
      - name: Run integration-critical suites
        run: |
          pytest tests/test_write_path_e2e.py \
                 tests/test_storage_migration.py \
                 tests/test_api/ \
                 tests/test_distribution_contracts.py \
                 tests/test_openai_compat_real_transport.py \
                 --tb=short -q --no-cov

  test-full-coverage:
    name: Full Coverage Gate (push/nightly/manual)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,standard]"
      - name: Run full tests with coverage
        run: pytest tests/ --tb=short -q --cov=dochris --cov-report=xml --cov-report=term-missing
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
      - name: Coverage summary
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; e=ET.parse('coverage.xml').getroot(); print(f'{float(e.attrib.get(\"line-rate\", 0))*100:.1f}%')")
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "Line coverage: **${COVERAGE}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See [coverage.xml](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." >> $GITHUB_STEP_SUMMARY
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 依赖安全门禁：生产依赖存在已知漏洞即失败（react-router 历史漏洞回归防护）
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate --registry=https://registry.npmjs.org
      - name: Run frontend tests
        run: npm test --if-present
      - run: npm run lint
      - run: npm run build
      - name: Run isolated browser smoke gate
        run: node e2e/smoke.mjs
      - name: Validate production Compose contract
        working-directory: .
        run: docker compose --profile api config --quiet

  # REL-03: 同时构建 API 与 Web 两个生产镜像
  docker-api:
    name: API Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: dochris:api-ci
          build-args: |
            BUILD_TARGET=api
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test API image
        run: |
          # 默认 CMD 是 kb --help（立即退出）；API 镜像必须以 uvicorn 启动验证
          docker run -d --name dochris-api-smoke -p 8000:8000             -e DOCHRIS_ALLOW_UNAUTHENTICATED=true             dochris:api-ci             uvicorn dochris.api.app:app --host 0.0.0.0 --port 8000
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              echo "API healthy"; docker rm -f dochris-api-smoke >/dev/null; exit 0
            fi
            sleep 2
          done
          docker logs dochris-api-smoke || true
          docker rm -f dochris-api-smoke >/dev/null || true
          exit 1

  docker-web:
    name: Web Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: dochris:web-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # REL-04: 完整 Compose 启动 + 健康检查
  compose-e2e:
    name: Compose Stack E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start full stack
        run: docker compose --profile api up -d --build
      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              echo "API healthy"; exit 0
            fi
            sleep 3
          done
          docker compose --profile api logs --tail=100
          exit 1
      - name: Wait for Web health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null; then
              echo "Web healthy"; exit 0
            fi
            sleep 3
          done
          docker compose --profile api logs --tail=100 web
          exit 1
      - name: Query smoke through API
        run: curl --fail --silent "http://127.0.0.1:8000/api/v1/status" >/dev/null
      - name: Stop and keep volumes
        run: docker compose --profile api down

  docs:
    name: Docs (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: bandit -r src/dochris/ -ll --skip B101,B102,B104

  # DEBT-07：nightly 基准测试（schedule 触发或手动），报告作为 artifact 保存
  benchmark-nightly:
    name: Benchmark (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,standard]"
      - name: Run benchmark suite
        run: |
          mkdir -p reports
          pytest benchmark/ --benchmark-only -q \
            --benchmark-json=reports/benchmark-${{ github.run_id }}.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: reports/
          retention-days: 90
