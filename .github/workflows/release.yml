name: Release

# REL-06: tag 推送不能绕过测试直接发布 —— 发布必须先通过完整 release gate，
# 且只发布通过门禁的同一份 artifact。
# REL-07: PyPI 采用 Trusted Publishing（OIDC），不再使用长期 API Token。
#   前置要求：在 PyPI 项目设置中配置 Trusted Publisher，
#   owner/repo/workflow = <owner>/<repo>/release.yml，environment 必须填 pypi（与下方 publish job 一致）。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  # 完整 CI 门禁：lint/typecheck/fast/integration + 前端全套 + API/Web 镜像构建与
  # API smoke + Compose 栈 E2E + docs strict（与 docs/RELEASE.md 的承诺一致）
  ci:
    name: Release Gate (full CI)
    uses: ./.github/workflows/ci.yml

  build:
    name: Build sdist / wheel / SBOM / checksums
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine cyclonedx-bom
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          [ "$TAG_VERSION" = "$PKG_VERSION" ] || {
            echo "::error::tag v$TAG_VERSION 与 pyproject 版本 $PKG_VERSION 不一致"; exit 1; }
      - name: Build package
        run: python -m build
      - name: Check package
        run: twine check dist/*
      - name: Generate SBOM (CycloneDX)
        run: |
          pip install -e ".[standard]" --quiet
          cyclonedx-py environment --output-format json --output-file sbom.json
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > ../checksums.sha256
          cd ..
          sha256sum sbom.json >> checksums.sha256
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            dist/
            sbom.json
            checksums.sha256
          retention-days: 7

  # REL-09 验证：wheel 在干净环境安装并完成查询 smoke（macOS arm64 + Linux x86_64）
  install-smoke:
    name: Install smoke (${{ matrix.os }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-arm64
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create clean venv and install wheel
        run: |
          python -m venv .smoke-venv
          ./.smoke-venv/bin/pip install --no-cache-dir dist/*.whl
      - name: Query smoke (offline paths)
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          ./.smoke-venv/bin/python - <<'PY'
          import os
          import dochris
          from dochris.settings import get_settings
          s = get_settings()
          expected = os.environ["EXPECTED_VERSION"].removeprefix("v")
          print("version:", dochris.__version__, "| expected:", expected)
          print("workspace:", s.workspace)
          # 发布门禁：安装后的运行时版本必须与 tag 严格一致
          assert dochris.__version__ == expected, (
              f"wheel 版本 {dochris.__version__} != tag {expected}"
          )
          PY
          ./.smoke-venv/bin/python -m dochris.cli.main --help >/dev/null

  github-release:
    name: Attach artifacts to GitHub Release
    needs: [build, install-smoke, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/* sbom.json checksums.sha256

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: [ci, build, install-smoke, github-release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
